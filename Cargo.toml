[package]
name = "gamefocus"
version = "0.1.0"
edition = "2021"
description = "Optimisations par jeu + mode focus (exceptions Discord) — léger, Rust"
license = "MIT"
authors = ["GLF / Kouro"]

[lib]
name = "gamefocus"
path = "src/lib.rs"

[[bin]]
name = "gamefocus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "5"
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.32"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
